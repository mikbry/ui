# cargo-audit configuration
#
# Sprint 4 (issue #51) cleared the `atty` and PyO3 0.22 advisories via the
# cbindgen 0.26 → 0.29.2 and PyO3 0.22 → 0.28.3 bumps. Issue #54 cleared the
# last two (`paste` unmaintained + `stabby` → `rand 0.8` unsound) by dropping
# the unused `safer-ffi` dep from mkui-c — the Sprint 4 rewrite uses raw
# opaque pointers + handle indices, so the FFI sugar was never load-bearing.
#
# This mirrors the `[advisories].ignore` list in `deny.toml`. Rationale for
# each ID lives there (deny.toml v2 accepts `{id, reason}` object form;
# cargo-audit's ignore is plain string IDs, so the reason must be looked up
# in deny.toml). Upstream sctk-adwaita chain tracker for the quick-xml 0.39.4
# + ttf-parser 0.25.1 removals: #132.

[advisories]
ignore = [
    "RUSTSEC-2026-0194",  # quick-xml 0.39.4 DoS (build-time-only via wayland-scanner proc-macro); see deny.toml
    "RUSTSEC-2026-0195",  # quick-xml 0.39.4 DoS (build-time-only via wayland-scanner proc-macro); see deny.toml
    "RUSTSEC-2026-0192",  # ttf-parser 0.25.1 unmaintained (informational, not exploitable); see deny.toml
]
