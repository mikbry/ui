name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# All jobs (fmt, clippy, test, test-doc, build-release, msrv, cargo-deny, cargo-audit) are active.
#
# `--locked` is enforced on every build/test/clippy invocation: CI fails loudly
# if Cargo.lock is stale relative to manifests, instead of silently regenerating
# mid-CI (Sprint 2 close — only the version-bump's lockfile-update saved main
# from being shipped stale).
#
# `-D warnings` is scoped to the clippy command only; do NOT re-introduce
# `RUSTFLAGS: -D warnings` at workflow scope (Sprint 2 retro Lesson 2).
#
# `mkui-py` is now back in the main workspace `clippy` / `test` /
# `test-doc` / `build-release` / `msrv` jobs (#5). PyO3 0.28's default
# `extension-module` build needs only a Python interpreter on PATH at
# build time (each job adds `actions/setup-python`) — it does NOT link
# `libpython` (the host provides the symbols at load time), so the
# cdylib builds and the non-interpreter test path runs without dev
# headers. The old PyO3-0.22 / Python-3.14 build-script rejection that
# forced the exclusion is gone after the 0.28.3 bump.
#
# **The dedicated `mkui-py-bindings` job below** still runs the two
# interpreter-LINKED tests — byte-identical snapshot parity + a live
# `import mkui_py` smoke — via `--no-default-features --features
# parity-test` (which pulls `pyo3/auto-initialize` and links `libpython`).
# That link mode is mutually exclusive with `extension-module`, so it
# cannot ride along in the main jobs.
#
# `mkui-c` is now back in every job — the Sprint 4 handle-based rewrite
# (#51) folds in `// SAFETY:` annotations on every `unsafe` block and clears
# `clippy::not_unsafe_ptr_arg_deref` by design (opaque handles, no inline
# pointer-deref).

jobs:
  changes:
    # Path-filter gate for the cost-reduction work (#151, Win 2 + Win 4).
    # docs-only PRs (README refresh, CHANGELOG backfill, ADR updates) must not
    # spin up the expensive code jobs — the Lavapipe GPU lanes and the
    # interpreter-linked Python bindings are the largest per-run consumers.
    #
    # GitHub Actions exposes no changed-file list in expression context, and
    # there is no job-level `paths:` key (only the workflow-level `on.*.paths`,
    # which would gate the WHOLE workflow and leave required checks stuck on
    # "Expected — Waiting for status to be reported"). So this tiny job computes
    # the touched paths once and publishes a boolean the code jobs gate on with
    # `needs: changes` + `if:`. A job skipped by `if:` reports as "skipped",
    # which branch protection treats as success — so gating never wedges a
    # required check.
    #
    # `push` (main) always reports `code=true`: the post-merge push-to-main full
    # run is the backstop and must never be path-skipped. The path set is a
    # superset of the issue's `crates/**`, `examples/**`, `.github/workflows/**`
    # — it also includes the root Cargo manifests + lockfile and toolchain/deny
    # config, so a dependency-bump or MSRV-pin PR still runs the full matrix
    # (the issue's 3-glob list omits these, which would wrongly skip tests on a
    # lockfile-only bump).
    #
    # Gates use `code != 'false'` (fail-closed), not `code == 'true'`: if this
    # classifier job itself fails (checkout, git diff, shell error), its output
    # is missing rather than 'false', and `needs: changes` skips downstream
    # jobs — which branch protection would treat as success on required checks.
    # The invert keeps docs-only PRs cheap while ensuring classifier failure
    # runs the full matrix instead of silently letting a code PR through.
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Non-PR event (${{ github.event_name }}): running all code jobs."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          echo "Diffing $base..$head"
          files="$(git diff --name-only "$base" "$head")"
          echo "Changed files:"
          echo "$files"
          # Any Rust/example/workflow/manifest/toolchain change re-enables the
          # code jobs. Anything else (docs, *.md, LICENSE, .vscode) is docs-only.
          if printf '%s\n' "$files" | grep -Eq '^(crates/|examples/|bindings/|\.github/workflows/|Cargo\.toml|Cargo\.lock|deny\.toml|rust-toolchain)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Result: code paths touched — running code jobs."
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Result: docs-only change — skipping GPU + bindings + release + msrv code jobs."
          fi

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      # `--exclude` the three backend-pinned showcase examples: each enables a
      # different primary backend on `mkui`, and Cargo feature unification
      # would otherwise enable all three at once and trip the one-backend
      # `compile_error!` guard (#102). They build package-aware (see the
      # `mkui-examples` job + ADR 0006). #105 owns the wider feature matrix.
      - run: cargo clippy --workspace --exclude console-showcase --exclude web-showcase --exclude native-showcase --all-targets --locked -- -D warnings

  test:
    # Package-aware feature matrix (#105). The default `--workspace` leg runs
    # default features only; feature-gated code (`mkui-runtime`'s `snapshot`,
    # `mkui-core`'s `serde`, …) would rot undetected without exercising it where
    # it lives. A naive workspace `--all-features` cannot be used: Cargo feature
    # unification would enable conflicting backends on the `mkui` bridge at once
    # and trip the #102 one-backend `compile_error!`, and `mkui-py`'s
    # interpreter-linked `parity-test` mode is mutually exclusive with its
    # default `extension-module` link. So the axis is PER-CRATE instead:
    #
    #   * Compatible crates get `--all-features` (mutually-compatible per crate).
    #   * The `mkui` bridge is tested per-individual-backend AND
    #     `--no-default-features` — NEVER all backends together (#102).
    #
    # Two crates can't take `--all-features` and are handled package-aware:
    #   * `mkui-c` — its `web` + `console` features each forward a *different*
    #     primary backend to `mkui`, so `--all-features` enables two backends
    #     and hits the #102 guard. Tested per-backend instead.
    #   * `mkui-wgpu` — `--all-features` pulls `gpu-tests`, which asserts a real
    #     Vulkan/Lavapipe adapter and fails (no silent skip) on the displayless
    #     runner. Compiled with `--no-run` here; the `gpu-offscreen` job owns the
    #     actual GPU execution of `gpu-tests` (+ `slug`).
    #
    # `mkui-py` is NOT in this matrix — its dedicated `mkui-py-bindings` job
    # owns its interpreter-linked feature combinations and is not duplicated.
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      # `fail-fast: true` (#151, Win 1). #105 landed this package-aware matrix
      # with `fail-fast: false` for clear failure attribution — reasonable then,
      # expensive in practice: one failing feature combo let the other 13 legs
      # run to completion. Attribution stays clear because the leg that STOPS
      # the matrix is the failing one; the surviving legs' logs add ~30-50% of
      # wasted runner minutes on a red run for no diagnostic gain.
      fail-fast: true
      matrix:
        include:
          # Default-feature workspace test (integration + examples + default
          # paths). Backend-pinned examples excluded — they can't be unified
          # into one build under the #102 one-backend guard; the `mkui-examples`
          # job covers them package-aware.
          - name: workspace-default
            args: --workspace --exclude console-showcase --exclude web-showcase --exclude native-showcase
          # Compatible crates: `--all-features` per-crate.
          - name: mkui-core
            args: -p mkui-core --all-features
          - name: mkui-runtime
            args: -p mkui-runtime --all-features
          - name: mkui-text
            args: -p mkui-text --all-features
          - name: mkui-web
            args: -p mkui-web --all-features
          - name: mkui-console
            args: -p mkui-console --all-features
          - name: mkui-vector2d
            args: -p mkui-vector2d --all-features
          - name: mkui-vector2d-wgpu
            args: -p mkui-vector2d-wgpu --all-features
          # mkui-wgpu: compile-only `--all-features` (gpu-tests can't run here).
          - name: mkui-wgpu-compile
            args: -p mkui-wgpu --all-features --no-run
          # mkui-c: per-backend (web+console can't coexist — #102).
          - name: mkui-c-console
            args: -p mkui-c --no-default-features --features console
          - name: mkui-c-web
            args: -p mkui-c --no-default-features --features web
          # mkui bridge: each primary backend separately + no-default-features.
          - name: mkui-bridge-web
            args: -p mkui --no-default-features --features web
          - name: mkui-bridge-console
            args: -p mkui --no-default-features --features console
          - name: mkui-bridge-wgpu
            args: -p mkui --no-default-features --features wgpu
          - name: mkui-bridge-no-default
            args: -p mkui --no-default-features
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-test-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-${{ matrix.name }}-
            ${{ runner.os }}-cargo-test-
      - run: cargo test ${{ matrix.args }} --locked

  gpu-offscreen:
    # Surfaceless offscreen GPU readback tests (#106). These exercise a real
    # WGPU pipeline — adapter/device negotiation, clear, draw, and 256-byte
    # row-aligned readback — without opening a window. They are gated behind
    # the `gpu-tests` feature so the default `test` job above stays displayless
    # and needs no Vulkan ICD.
    #
    # The runner is still displayless: Mesa/Lavapipe is a CPU software
    # rasterizer reached through the pinned `VK_ICD_FILENAMES` — no X11/Wayland
    # server is required. The harness selects `Backends::VULKAN` and asserts a
    # Vulkan + CPU adapter; adapter/device unavailability fails the test (no
    # silent skip), so a missing ICD surfaces here loudly instead of passing
    # vacuously.
    #
    # Path-gated (#151, Win 2): the two Lavapipe GPU lanes (~10-15 min each) are
    # the largest Linux runtime consumers and have no bearing on a docs-only
    # change, so they skip when `changes` reports no code paths touched.
    #
    # Vulkan Validation Layers (VVL, #153). PR #149 shipped with 29 green CI
    # checks and immediately panicked on macOS Metal at first UI draw — this
    # job's Lavapipe adapter negotiated a wgpu bind-group/layout mismatch
    # without complaint because the loader had no validation layer manifest
    # installed, only the bare Lavapipe ICD. `wgpu` requests
    # `VK_LAYER_KHRONOS_validation` by default on debug builds (the profile
    # `cargo test` uses) via `InstanceFlags::VALIDATION`, but a missing layer
    # manifest makes that request a silent no-op — the instance is created
    # without it and no diagnostic is raised. Installing
    # `vulkan-validation-layers` supplies the manifest so that existing
    # request actually resolves; the env vars below are redundant reinforcement
    # for older/newer loader versions that key off them instead of (or in
    # addition to) the debug-build default. The "confirm active" step below is
    # the actual gate: if the layer manifest ever goes missing again (e.g. a
    # future Ubuntu image swap), this job fails loudly on the log-grep instead
    # of quietly losing VVL coverage again.
    name: gpu-offscreen
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Mesa/Lavapipe Vulkan ICD + Vulkan Validation Layers (#153)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools
          # Vulkan validation layers package name varies across Ubuntu:
          #   * 22.04 jammy — `vulkan-validationlayers` (Debian one-word style)
          #   * 24.04 noble — same one-word `vulkan-validationlayers`
          #   * older releases — hyphenated `vulkan-validation-layers`
          # Try the modern name first, fall back to the legacy hyphenated name,
          # fail loud if neither is present (silent skip would defeat the whole
          # point of #153).
          if ! sudo apt-get install -y --no-install-recommends vulkan-validationlayers; then
            if ! sudo apt-get install -y --no-install-recommends vulkan-validation-layers; then
              echo "::error::Neither vulkan-validationlayers nor vulkan-validation-layers is available in this apt sources — cannot enable VVL (#153)"
              exit 1
            fi
          fi
          # Pin the Vulkan loader to Mesa's Lavapipe (llvmpipe) software ICD so
          # the adapter is deterministically Vulkan + CPU regardless of runner
          # GPU. The exact filename varies by Mesa version, so discover it
          # rather than hardcoding the path; fail loudly if it is absent (no
          # silent skip — a missing ICD must not let the GPU tests vanish).
          echo "Installed Vulkan ICDs:"
          ls -la /usr/share/vulkan/icd.d/ || true
          icd="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n1)"
          if [ -z "$icd" ]; then
            echo "::error::Lavapipe ICD JSON not found after installing mesa-vulkan-drivers"
            exit 1
          fi
          echo "Pinning VK_ICD_FILENAMES=$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          # Diagnostic: confirm the loader sees the Lavapipe adapter.
          VK_ICD_FILENAMES="$icd" vulkaninfo --summary || true
      - name: Enable Vulkan validation layers + confirm active (#153)
        run: |
          set -euo pipefail
          layer_dir="/usr/share/vulkan/explicit_layer.d"
          echo "Explicit layer manifests in $layer_dir:"
          ls -la "$layer_dir" || true
          if [ ! -d "$layer_dir" ] || [ -z "$(ls -A "$layer_dir" 2>/dev/null)" ]; then
            echo "::error::$layer_dir is missing or empty after installing vulkan-validation-layers — VVL cannot activate (#153)"
            exit 1
          fi
          # Both `VK_INSTANCE_LAYERS` (classic loader knob) and
          # `VK_LOADER_LAYERS_ENABLE` (newer glob-based loader knob) are set so
          # the layer activates regardless of which the runner's loader
          # version honors; harmless if only one is recognized.
          {
            echo "VK_LAYER_PATH=$layer_dir"
            echo "VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation"
            echo "VK_LOADER_LAYERS_ENABLE=*validation*"
          } >> "$GITHUB_ENV"
          # `VK_LOADER_DEBUG=layer` makes the Vulkan loader trace layer
          # discovery/insertion to stderr so we can grep for confirmation the
          # layer actually activated, not just that we asked for it. This is
          # the load-bearing check (not `|| true`) — if the layer manifest is
          # ever missing again, this step fails the job instead of letting the
          # gap reopen silently.
          #
          # Per the Vulkan spec, `vkCreateInstance` MUST return
          # `VK_ERROR_LAYER_NOT_PRESENT` if a loader-env-requested layer can't
          # be found, so a missing manifest should already make `vulkaninfo`
          # itself fail non-zero — checked explicitly below rather than via
          # `set -e` so the diagnostic is clear either way. On top of that,
          # the trace is checked for both an explicit failure phrase (so a
          # loader version that logs-and-continues instead of hard-failing
          # can't slip past a bare substring match on the layer's own name —
          # that name legitimately appears in "not found" messages too) and
          # an affirmative insertion/loading phrase.
          set +e
          out="$(VK_LAYER_PATH="$layer_dir" VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation VK_LOADER_LAYERS_ENABLE='*validation*' VK_LOADER_DEBUG=layer vulkaninfo --summary 2>&1)"
          status=$?
          set -e
          echo "$out"
          if [ "$status" -ne 0 ]; then
            echo "::error::vulkaninfo exited $status with VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation set — the loader could not activate the layer (missing manifest?) (#153)"
            exit 1
          fi
          if printf '%s' "$out" | grep -Eiq 'not (found|present)|unable to (find|activate)|cannot activate|layer_not_present'; then
            echo "::error::Vulkan loader trace reports the validation layer could not be found/activated (#153)"
            exit 1
          fi
          if ! printf '%s' "$out" | grep -Eiq '(insert|load(ing)?)[^\n]*(instance )?layer[^\n]*khronos_validation|khronos_validation[^\n]*(insert|load)'; then
            echo "::error::No affirmative Vulkan loader trace showing VK_LAYER_KHRONOS_validation was inserted/loaded — validation layers are not confirmed active (#153). gpu-offscreen would silently lose VVL coverage."
            exit 1
          fi
          echo "Confirmed: VK_LAYER_KHRONOS_validation is active for gpu-offscreen (vulkaninfo instance)."
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-gpu-offscreen-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gpu-offscreen-
      # `RUST_LOG=wgpu_hal=debug,wgpu_core=info` + `--nocapture` (#153): the
      # "confirm active" step above only proves `vulkaninfo`'s own instance
      # sees the layer, not that *this* process's wgpu instance requested it.
      # wgpu-hal logs its enabled Vulkan instance layers at debug level on
      # instance creation; `--nocapture` forces that (and the harness's own
      # `eprintln!` adapter diagnostics) into the job log even on a passing
      # run, so acceptance criterion #3 ("confirm via wgpu's init log") is
      # actually checkable by grepping this step's CI output afterward.
      - name: Run gpu-tests (#106) with wgpu-hal instance-layer logging
        env:
          RUST_LOG: wgpu_hal=debug,wgpu_core=info
        run: cargo test -p mkui-wgpu --features gpu-tests --locked -- --nocapture
      # Slug lane GPU acceptance tests (#66) — hand-authored curve/band records
      # rendered through the same Vulkan/Lavapipe contract. Needs both the #106
      # harness (`gpu-tests`) and the adapter (`slug`).
      - name: Run gpu-tests,slug (#66) with wgpu-hal instance-layer logging
        env:
          RUST_LOG: wgpu_hal=debug,wgpu_core=info
        run: cargo test -p mkui-wgpu --features "gpu-tests,slug" --locked -- --nocapture

  feature-slug:
    # Package-aware rows for the #66 Slug lane (extends the #105 matrix): the
    # new adapter crate, the wgpu backend with `slug` on, and the example with
    # `slug` on. These feature combinations are off by default, so `--workspace`
    # never exercises them — without this job a Slug-only compile or lint break
    # slips through. Pure compile + lint (no GPU), so it runs on the default
    # displayless runner.
    name: feature-slug
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-feature-slug-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-feature-slug-
      # The new acyclic adapter crate (default features).
      - run: cargo clippy -p mkui-vector2d-wgpu --all-targets --locked -- -D warnings
      - run: cargo test -p mkui-vector2d-wgpu --locked
      # The wgpu backend with the Slug lane on.
      - run: cargo clippy -p mkui-wgpu --features slug --all-targets --locked -- -D warnings
      - run: cargo test -p mkui-wgpu --features slug --locked
      # The example forwarding `slug` down to the backend.
      - run: cargo clippy -p atoms-on-wgpu --features slug --all-targets --locked -- -D warnings
      - run: cargo build -p atoms-on-wgpu --features slug --locked
      # #67's text example: the GPU smoke (Abel Slug + bitmap) with `slug` on.
      - run: cargo clippy -p text --features slug --all-targets --locked -- -D warnings
      - run: cargo build -p text --features slug --locked

  mkui-backend-matrix:
    # Enforces the `mkui` one-primary-backend invariant (#102). The bridge
    # crate selects a backend via a Cargo feature (`web` / `console` / `wgpu`);
    # enabling more than one is a hard `compile_error!`, not silent cfg
    # precedence. Cargo feature unification across a dependency graph means a
    # workspace-wide `--all-features` build would mask this — so this job is
    # deliberately PACKAGE-AWARE (`-p mkui --no-default-features`) and never
    # uses `--all-features`. It does NOT duplicate #105's general
    # package-aware matrix; it owns only the backend-conflict assertion.
    #
    # Valid builds (exactly one or zero primary backends) must succeed; every
    # conflicting pair (and the all-three combo) must fail with the intended
    # message. A regression that re-introduces silent precedence makes an
    # invalid combo compile, which fails this job loudly.
    name: mkui-backend-matrix
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-mkui-backend-matrix-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mkui-backend-matrix-
      - name: Valid single-backend (and no-backend) builds must succeed
        run: |
          set -euo pipefail
          for feat in "" "web" "console" "wgpu"; do
            if [ -z "$feat" ]; then
              echo "::group::cargo check -p mkui --no-default-features"
              cargo check -p mkui --no-default-features --locked
            else
              echo "::group::cargo check -p mkui --no-default-features --features $feat"
              cargo check -p mkui --no-default-features --features "$feat" --locked
            fi
            echo "::endgroup::"
          done
      - name: Conflicting-backend builds must fail with the intended message
        run: |
          set -uo pipefail
          expected="enable exactly one primary backend feature"
          status=0
          for combo in "web,console" "web,wgpu" "console,wgpu" "web,console,wgpu"; do
            echo "::group::cargo check -p mkui --no-default-features --features $combo (must FAIL)"
            out="$(cargo check -p mkui --no-default-features --features "$combo" --locked 2>&1 || true)"
            echo "$out"
            echo "::endgroup::"
            if cargo check -p mkui --no-default-features --features "$combo" --locked >/dev/null 2>&1; then
              echo "::error::feature combo '$combo' compiled but MUST be a compile error (silent backend precedence regressed)"
              status=1
            elif ! printf '%s' "$out" | grep -q "$expected"; then
              echo "::error::feature combo '$combo' failed but not with the one-backend compile_error message"
              status=1
            fi
          done
          exit "$status"

  mkui-examples:
    # The three backend-pinned showcase examples (console / web / wgpu) are
    # excluded from the aggregate `--workspace` jobs because they enable
    # mutually-exclusive `mkui` backends that cannot be unified into one build
    # under the #102 one-backend guard. This job restores their coverage by
    # building each one PACKAGE-AWARE, so a real regression in an example still
    # fails CI.
    #
    # All three build on the native (host) target — the same target the
    # aggregate `--workspace` jobs used before #102, so this is coverage at
    # parity, not new coverage. A dedicated `wasm32-unknown-unknown` build of
    # `web-showcase` is intentionally NOT added here: it surfaces a pre-existing
    # mkui-core wasm bug (the `#[cfg(target_arch = "wasm32")]`
    # `MkuiError::JsValue(#[from] JsValue)` variant requires `JsValue:
    # std::error::Error`, which it does not implement) that is unrelated to the
    # #102 backend-selection contract. Adding a real wasm32 CI lane + fixing
    # that variant is deferred to a follow-up issue.
    name: mkui-examples
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-mkui-examples-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mkui-examples-
      - name: Build console-showcase (console backend)
        run: cargo build -p console-showcase --locked
      - name: Build native-showcase (wgpu backend)
        run: cargo build -p native-showcase --locked
      - name: Build web-showcase (web backend, native target)
        run: cargo build -p web-showcase --locked

  test-doc:
    name: test-doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-test-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-doc-
      # Backend-pinned examples excluded — see the clippy/test jobs (#102).
      - run: cargo test --workspace --exclude console-showcase --exclude web-showcase --exclude native-showcase --doc --locked

  build-release:
    name: build-release
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-build-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-release-
      # Backend-pinned examples excluded — see the clippy/test jobs (#102).
      - run: cargo build --workspace --exclude console-showcase --exclude web-showcase --exclude native-showcase --release --locked

  msrv:
    # MSRV gate: `Cargo.toml` declares the workspace's minimum supported Rust
    # version, but every other job uses `dtolnay/rust-toolchain@stable`, which
    # floats to whatever stable is current and never exercises the promised
    # floor. This job pins the toolchain to the declared MSRV so a dep that
    # silently requires a newer compiler fails here instead of on a user's
    # fresh-MSRV install. Keep this pin in lockstep with
    # `[workspace.package].rust-version` in Cargo.toml.
    #
    # `cargo check` (not `test`) is enough to catch the compile-floor break
    # without paying the full test-suite CI time. `mkui-py` is included now
    # that the PyO3 0.28.3 bump cleared the build-script rejection (#5); the
    # default `extension-module` path only needs a Python interpreter on
    # PATH, supplied by `actions/setup-python`.
    name: msrv
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-
      # Backend-pinned examples excluded — see the clippy/test jobs (#102).
      - run: cargo check --workspace --exclude console-showcase --exclude web-showcase --exclude native-showcase --locked

  mkui-py-bindings:
    # The interpreter-LINKED Python binding tests. Two suites live under
    # the `parity-test` feature:
    #   * `tests/parity.rs`  — byte-identical Rust/C/Py snapshot parity
    #     (Codex round-8 P1 #1). The Rust and C halves run in the main
    #     `test` job (mkui-c parity test in `crates/mkui-c/tests/parity.rs`);
    #     this asserts the `mkui_py::App` JSON snapshot equals the same tree
    #     built directly through `mkui_runtime::AppTree`.
    #   * `tests/smoke_py.rs` — a live `import mkui_py` smoke (#5): registers
    #     the extension module into an embedded interpreter and builds +
    #     fires a tree through the real Python dispatch path.
    #
    # macOS is skipped (CI is Linux) because the PyO3 cdylib link on macOS
    # hosts requires extra setup; the parity test additionally guards with
    # `#[cfg(not(target_os = "macos"))]` where relevant.
    #
    # Path-gated (#151, Win 4). The interpreter-linked binding suite only
    # exercises `crates/mkui-py` (+ its parity oracle); a docs-only change can't
    # move it, so it skips when no code paths are touched. NOTE: the issue's Win
    # 4 targets a macOS-3-core variant of this job as the dominant cost driver —
    # this repo's `ci.yml` runs the bindings on `ubuntu-latest` only (no macOS
    # lane exists), so the macOS scope-trim does not apply. Path-gating the
    # existing ubuntu job is the equivalent per-PR saving on docs-only PRs while
    # preserving full coverage on code PRs. See PR body "Scope decision".
    name: mkui-py-bindings
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-py-bindings-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-py-bindings-
      - name: Run mkui-py interpreter-linked binding tests
        # `--no-default-features` turns off `extension-module` so PyO3
        # links against libpython (the test binary EMBEDS Python). The
        # `parity-test` feature pulls `pyo3/auto-initialize`; `console`
        # is the only other default-features bit we still want active.
        # `PYO3_PYTHON` tells pyo3-build-config which interpreter to bind
        # against. Without it (or without `--no-default-features`) the
        # round-8 CI fired `rust-lld: error: undefined symbol: PyExc_*`
        # because `extension-module` deliberately skips libpython linkage.
        # No `--test` filter: runs both `parity` and `smoke_py`.
        env:
          PYO3_PYTHON: python3
        run: cargo test -p mkui-py --no-default-features --features "parity-test,console" --locked

  cbindgen-header-clean:
    # Codex round-8 P2 follow-up: prove the checked-in
    # `crates/mkui-c/include/mkui_c.h` matches what cbindgen would
    # generate from source. If `build.rs` rewrites the header and
    # `git diff` is non-empty, the FFI surface drifted and the diff
    # surfaces it loudly instead of being noticed by a downstream
    # consumer at link time.
    name: cbindgen-header-clean
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-cbindgen-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cbindgen-
      - name: Build mkui-c (regenerates include/mkui_c.h)
        run: cargo build -p mkui-c --locked
      - name: Assert mkui_c.h is up to date with cbindgen output
        run: |
          if ! git diff --exit-code crates/mkui-c/include/mkui_c.h; then
            echo "::error::crates/mkui-c/include/mkui_c.h is out of date — run \`cargo build -p mkui-c\` locally and commit the regenerated header"
            exit 1
          fi

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `rustsec/audit-check` is the maintained successor to the archived
      # `actions-rs/audit-check`. It reads `.cargo/audit.toml` for the
      # ignore list (kept in sync with `deny.toml`'s `[advisories].ignore`).
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
