name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# `mkui-py` is excluded from every job because of the open PyO3 / Python 3.14
# build issue. Re-enable it once that lands.
#
# Three jobs (fmt, clippy, build-release) are commented out below because the
# workspace has pre-existing debt that lands as separate Sprint 2 hygiene PRs.
# Each TODO marker references the issue that uncomments it.

jobs:
