[workspace]
resolver = "2"
members = [
    "crates/mkui-runtime",     # Portable AppTree substrate (Sprint 4)
    "crates/mkui-core",        # Core types, traits, and headless logic
    "crates/mkui-text",        # Text-system trait + from-scratch bitmap prototype
    "crates/mkui-vector2d",    # Backend-neutral 2D paths/curves + Slug glyph encoder (Sprint 7)
    "crates/mkui-vector2d-wgpu", # Native WGPU adapter for Slug glyph blobs (Sprint 7, #66)
    "crates/mkui-wgpu",        # WGPU-facing scene primitives and declarative builders
    "crates/mkui-web",         # Web/WASM renderer
    "crates/mkui-console",     # Terminal/TUI renderer
    "crates/mkui-c",           # C/C++ bindings
    "crates/mkui-py",          # Python bindings
    "crates/mkui",             # Bridge crate
    "examples/showcase-common", # Common showcase components
    "examples/headless-showcase", # Headless components demo
    "examples/console-showcase", # Console/Terminal UI demo
    "examples/web-showcase",   # Web/WASM showcase
    "examples/native-window",  # Native winit + wgpu window
    "examples/atoms-on-wgpu",  # Wgpu badge + dot atoms via AppTree (Sprint 5)
    "examples/native-showcase", # Cross-binding showcase on the wgpu backend (Sprint 5)
]

# The three backend-pinned showcase examples each enable a *different* primary
# backend feature on the `mkui` bridge crate (`console` / `web` / `wgpu`).
# Since #102 the bridge enforces exactly one primary backend at compile time
# (no silent precedence — see ADR 0006). Cargo unifies a shared dependency's
# features across every member built in one invocation, so building all three
# together (`cargo build`, `cargo test --workspace`, …) would enable all three
# backends on `mkui` at once and trip the `compile_error!` guard.
#
# `default-members` therefore excludes them from bare/aggregate commands; they
# build package-aware (`cargo build -p console-showcase`, the `trunk` wasm
# build for `web-showcase`, etc.) and CI compiles each separately. The broad
# `--workspace` CI jobs pass `--exclude` for the same three. #105 owns the
# wider package-aware feature matrix; this list only keeps the default build
# green under the one-backend invariant.
default-members = [
    "crates/mkui-runtime",
    "crates/mkui-core",
    "crates/mkui-text",
    "crates/mkui-vector2d",
    "crates/mkui-wgpu",
    "crates/mkui-web",
    "crates/mkui-console",
    "crates/mkui-c",
    "crates/mkui-py",
    "crates/mkui",
    "examples/showcase-common",
    "examples/headless-showcase",
    "examples/native-window",
    "examples/atoms-on-wgpu",
]

[workspace.package]
version = "0.9.3"
edition = "2021"
rust-version = "1.87"
authors = ["miklabs"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mikbry/ui"

[workspace.dependencies]
# Core
thiserror = "1.0"

# Web
wasm-bindgen = "0.2"
web-sys = "0.3"
js-sys = "0.3"

# Console/TUI
crossterm = "0.28"
ratatui = "0.28"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Native rendering (mkui-wgpu)
wgpu = "29.0.1"
winit = "0.30.12"
bytemuck = { version = "1.25.0", features = ["derive"] }
pollster = "0.4.0"

# C/C++ bindings
libc = "0.2"
cbindgen = "0.29.2"

# Python bindings
pyo3 = "0.29.0"
pyo3-build-config = "0.29.0"
