# cargo-deny configuration
#
# Workspace policy:
#   - License: MIT OR Apache-2.0 dual; ban copyleft (GPL / AGPL family)
#   - Duplicates: warn on duplicate transitive deps (audit category 6 regression flag)
#   - Yanked: warn on yanked crates

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
yanked = "warn"
# Sprint 4 (issue #51) cleared 3 of 4 prior ignores:
#   - `atty` (RUSTSEC-2024-0375): cbindgen 0.26 → 0.29.2 bump dropped the
#     `clap 3` → `atty` chain.
#   - PyO3 0.22 `PyString::from_object` (RUSTSEC-2025-0020): PyO3 0.22 →
#     0.28.3 bump.
#   - The `clap 3` / `bitflags 1` / `syn 1` transitive duplicate cluster
#     pruned by the same cbindgen bump (not advisory-tagged, but cleared
#     by the dep graph collapse).
# Issue #54 cleared the `safer-ffi` advisory chain (`paste` unmaintained
# RUSTSEC-2024-0436 + `stabby` → `rand 0.8` unsound RUSTSEC-2026-0097): the
# Sprint 4 mkui-c rewrite uses raw opaque pointers + handle indices, so the
# unused `safer-ffi` dep was dropped entirely.
#
# RUSTSEC-2026-0194 + RUSTSEC-2026-0195 (both published 2026-06-29):
# `quick-xml 0.39.4` DoS advisories (quadratic parse on duplicate attribute
# names; unbounded namespace-declaration allocation in `NsReader`), both
# patched in `quick-xml >= 0.41.0`. mkui reaches `quick-xml` exactly once via
# `winit → sctk-adwaita → smithay-client-toolkit → wayland-scanner`, and only
# on Linux/Wayland compiles (verified: absent on `x86_64-apple-darwin` and
# `x86_64-pc-windows-msvc`). `wayland-scanner` is a proc-macro that parses
# static, trusted Wayland protocol XML files (bundled with `wayland-protocols`)
# at BUILD TIME to generate Rust bindings — `quick-xml` code is NOT linked
# into any runtime binary. The advisories' threat model (CVSS:AV:N — remote
# unauthenticated network attacker with crafted XML) does not apply to
# mkui: mkui never parses XML from any source at runtime, and even the
# build-time input is upstream-controlled static protocol specs, not
# adversarial input. `cargo update -p quick-xml` verified `0 packages` (the
# `wayland-scanner` `^0.39` pin makes 0.41 unreachable via cargo resolver
# alone). Tracked upstream as #132 — remove both entries when
# `smithay-client-toolkit` ships a release that bumps `quick-xml >= 0.41.0`.
# Soft re-review deadline: 2026-10-01 (90 days). deny.toml v2 has no
# schema-enforced `expires` field; the deadline is enforced by the #132
# tracker's `[ ] ` checklist item + Sprint 8 close ritual (audit round-8
# will grep for stale ignore entries).
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "quick-xml is build-time-only via wayland-scanner proc-macro on Linux/Wayland; runtime binaries contain no quick-xml code; upstream fix tracked in #132" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml is build-time-only via wayland-scanner proc-macro on Linux/Wayland; runtime binaries contain no quick-xml code; upstream fix tracked in #132" },
    # RUSTSEC-2026-0192 (2026-06-28): ttf-parser 0.25.1 unmaintained (informational, no vulnerability). Two reach paths, both bounded: (1) runtime via winit → sctk-adwaita → ab_glyph → owned_ttf_parser → ttf-parser on Linux/Wayland only, used for window-decoration font parsing (input is system fonts, not user input; no CVE-class threat model applies); (2) mkui-text [dev-dependencies] parity oracle per Sprint 7 plan v10 §3.6 (test-only). Skrifa migration is Sprint 8+ candidate; upstream sctk-adwaita bump tracked via same chain as #132.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is informational-unmaintained (not exploitable). Runtime reach only on Linux/Wayland via sctk-adwaita window-decoration font parsing (system fonts, not user input); also mkui-text [dev-dependencies] parity oracle per Sprint 7 §3.6. Skrifa migration tracked as Sprint 8+ candidate." },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
exceptions = []

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = [
    # Copyleft licenses we cannot ship under our MIT/Apache-2.0 dual licensing.
    # cargo-deny enforces this via the [licenses] block above, but listing
    # well-known copyleft crates here makes the intent explicit.
]
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
