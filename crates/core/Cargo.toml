[package]
name = "mkui-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Shared component, event, state, theme, and layout contracts for mkui backends"

[dependencies]
thiserror = { workspace = true }
mkui-text = { path = "../text" }
mkui-runtime = { path = "../runtime" }
serde = { workspace = true, optional = true }
# Real (non-dev) dependency: `components::MenuList` lowers through the
# `NodeKind::Custom` extension slot, whose `props` field is a
# `serde_json::Value` (#189).
serde_json = { workspace = true }
# Decode support for `components::Image`'s encoded-bytes source (#196):
# PNG via `png` (promoted here from its previous `mkui-wgpu` dev-dependency
# role — see that crate's `Cargo.toml`), WebP via `image-webp`. Decoding
# lives here, once, so every backend consumes the same validated
# `width`/`height` + (on demand) the same decoded RGBA8 — `mkui-wgpu`'s
# texture upload calls back into `mkui_core::image::decode_rgba8` rather
# than depending on either crate itself.
png = { workspace = true }
image-webp = { workspace = true }

[dev-dependencies]
# Parity tests need the runtime snapshot feature to compare the canonical
# JSON across construction frontends. Snapshot is opt-in for production
# builds (see ADR 0005); the dev-dep flips it on for tests.
mkui-runtime = { path = "../runtime", features = ["snapshot"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }

[features]
default = []
serde = ["dep:serde"]
