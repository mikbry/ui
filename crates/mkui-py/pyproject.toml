[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "mkui-py"
description = "Python bindings for mkui cross-platform UI library"
license = { text = "MIT OR Apache-2.0" }
authors = [
    { name = "miklabs", email = "contact@miklabs.com" }
]
keywords = ["ui", "gui", "cross-platform", "rust", "pyo3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9", 
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/mikbry/ui"
Repository = "https://github.com/mikbry/ui"
Documentation = "https://docs.miklabs.com/ui"
"Bug Reports" = "https://github.com/mikbry/ui/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "mkui_py"