[package]
name = "mkui-py"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Python bindings for mkui UI library"

[lib]
name = "mkui_py"
# `rlib` added so integration tests in `tests/` can exercise the App's
# Rust API directly without going through the Python interpreter. The
# `cdylib` build path used by maturin still produces the Python wheel.
crate-type = ["cdylib", "rlib"]

[dependencies]
mkui = { path = "../mkui" }
mkui-core = { path = "../mkui-core" }
mkui-runtime = { path = "../mkui-runtime", features = ["snapshot"] }
mkui-console = { path = "../mkui-console", optional = true }
showcase-common = { path = "../../examples/showcase-common" }

# PyO3 — `extension-module` is a feature below, not unconditional, so
# `cargo test --no-default-features` can disable it for the embedded-
# Python test path.
pyo3 = { workspace = true }

[features]
# `extension-module` is on by default so `maturin develop` (production
# path) builds the cdylib with the right link flags. `cargo test
# --no-default-features --features "parity-test,console"` disables it
# so the test binary can embed Python via `auto-initialize`.
default = ["console", "extension-module"]
web = ["mkui/web"]
console = ["mkui/console", "dep:mkui-console"]
extension-module = ["pyo3/extension-module"]
# Enables the host-side parity test (`tests/parity.rs`).
#
# `pyo3/auto-initialize` switches PyO3 from "extension-module loaded by
# Python" mode to "Rust binary that embeds Python" mode: pyo3-build-config
# emits `-l python3.X` plus the search path for `libpython3.X.so`. The two
# modes are mutually exclusive, so `cargo test` callers MUST also disable
# `extension-module` (`--no-default-features --features
# "parity-test,console"`). Callers must also set `PYO3_PYTHON` (or have a
# discoverable `python3` on PATH) so pyo3-build-config picks an
# interpreter to bind against.
parity-test = ["pyo3/auto-initialize"]

[dev-dependencies]
# Parity test reaches for `mkui_runtime::snapshot::TreeSnapshot` directly.
mkui-runtime = { path = "../mkui-runtime", features = ["snapshot"] }

[build-dependencies]
pyo3-build-config = { workspace = true }