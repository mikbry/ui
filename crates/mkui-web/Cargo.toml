[package]
name = "mkui-web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
mkui-core = { path = "../mkui-core", features = ["web"] }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
    "Document", 
    "Element", 
    "HtmlElement", 
    "HtmlInputElement",
    "HtmlButtonElement",
    "HtmlDivElement",
    "HtmlLabelElement",
    "HtmlHeadElement",
    "HtmlSelectElement",
    "Window",
    "Event",
    "MouseEvent",
    "KeyboardEvent",
    "EventTarget",
    "DomTokenList",
    "CssStyleDeclaration",
    "Node",
    "console",
    "Storage",
    "MediaQueryList",
    "Location"
] }
js-sys = { workspace = true }
thiserror = { workspace = true }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = []
console_error_panic_hook = ["dep:console_error_panic_hook"]