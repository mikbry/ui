[package]
name = "mkui-c"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "C/C++ bindings for mkui UI library"

[lib]
name = "mkui_c"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
mkui = { path = "../mkui" }
mkui-core = { path = "../mkui-core" }
mkui-runtime = { path = "../mkui-runtime", features = ["snapshot"] }

# For C string handling
libc = { workspace = true }

# For FFI safety
safer-ffi = { workspace = true, features = ["proc_macros"] }

[features]
default = ["console"]
web = ["mkui/web"]
console = ["mkui/console"]

[build-dependencies]
cbindgen = { workspace = true }