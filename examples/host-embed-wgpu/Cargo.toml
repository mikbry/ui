[package]
name = "host-embed-wgpu"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# The "host": owns its own wgpu instance/adapter/device/queue/surface and a
# lit 3D cube pass, exactly like a real game/engine host would (#175).
mkui-wgpu = { path = "../../crates/mkui-wgpu" }
mkui-text = { path = "../../crates/mkui-text" }
# `mkui_core::headless::MenuList` — the pause overlay's keyboard-navigable
# menu list (#255); this crate's render functions have no menu-list atom of
# their own (mkui-wgpu's components layer only draws it), so the headless
# selection/navigation logic comes from mkui-core directly.
mkui-core = { path = "../../crates/mkui-core" }
wgpu = { workspace = true }
winit = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }
