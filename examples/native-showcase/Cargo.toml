[package]
name = "native-showcase"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# Slug promoted to the default text-rendering lane (#311, making #285's
# `mkui-wgpu`-level default an explicit, designed default through the
# declarative bridge instead of an accidental one — this crate previously
# had no `[features]` table at all): a plain `cargo run -p native-showcase
# --release` renders Button/Card text through the Slug lane with no extra
# flags. `--no-default-features --features wgpu` is the new, real
# bitmap-fallback opt-out path.
default = ["wgpu", "slug"]
wgpu = ["showcase-common/wgpu", "mkui/wgpu"]
slug = ["showcase-common/slug", "mkui/slug"]

[dependencies]
# `default-features = false` on both: showcase-common and mkui each default
# to `slug`-on (#311). Pinning it here is what makes this crate's own
# `default`/`slug` features below the actual source of truth, so
# `--no-default-features --features wgpu` really does suppress Slug instead
# of it leaking back in through either dependency's own default.
showcase-common = { path = "../showcase-common", default-features = false }
mkui = { path = "../../crates/mkui", default-features = false }
