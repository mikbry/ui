[package]
name = "vector-showcase"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
mkui-wgpu = { path = "../../crates/mkui-wgpu" }
# Path-construction types for the vector column (`VectorPath`/`Stroke`/
# `PathCommand`). Optional: a feature-off build never names a vector type,
# matching the `slug`-off fallback's zero-API-break contract.
mkui-vector2d = { path = "../../crates/mkui-vector2d", optional = true }

[features]
# Sprint 8 Wave 2 (#143): draws the right-hand column through
# `Primitive::VectorPath` (#139) instead of falling back to the left
# column's triangulated `Quad`. Forwards to `mkui-wgpu`'s own `slug`
# feature (#66), which is what actually gates `PlacedVectorPath` + the Slug
# coverage pipeline this example draws through.
slug = ["mkui-wgpu/slug", "dep:mkui-vector2d"]
